<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>

    <picture>
      <!-- 960px and up: square version (shown at half the viewport width) -->
      <source
        media="(min-width: 960px)"
        sizes="50vw"
        srcset="images/hall-sq-480.jpg 480w,
                images/hall-sq-640.jpg 640w,
                images/hall-sq-800.jpg 800w,
                images/hall-sq-960.jpg 960w,
                images/hall-sq-1280.jpg 1280w,
                images/hall-sq-1440.jpg 1440w,
                images/hall-sq-1600.jpg 1600w,
                images/hall-sq-1920.jpg 1920w,
                images/hall-sq-2400.jpg 2400w">

      <!-- under 960px: landscape version (full width) -->
      <img
        src="images/hall-wide-720.jpg"
        sizes="100vw"
        srcset="images/hall-wide-320.jpg 320w,
                images/hall-wide-480.jpg 480w,
                images/hall-wide-640.jpg 640w,
                images/hall-wide-720.jpg 720w,
                images/hall-wide-960.jpg 960w,
                images/hall-wide-1440.jpg 1440w,
                images/hall-wide-1920.jpg 1920w,
                images/hall-wide-2160.jpg 2160w,
                images/hall-wide-2880.jpg 2880w"
        alt="Gallery hall in a museum with green walls, gilded picture frames and grey-blue sofas">
    </picture>
  </header>
</body>

</html>
